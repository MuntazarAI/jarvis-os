name: Nightly diagnostics

on:
  schedule:
    - cron: "15 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic:
    name: Deterministic health checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip pytest && python -m pip install -e .
      - name: Run deterministic tests
        run: >-
          python -m pytest -q
          tests/test_neural_nervous_system.py
          tests/test_plugin_sdk.py
          tests/test_android_node.py
          tests/test_device_fabric.py
      - name: Run benchmark
        run: python benchmarks/neural_benchmark.py --size 1000 --steps 1000 --repeats 3 --output benchmark-results/nightly-neural.json
      - name: Upload nightly benchmark
        uses: actions/upload-artifact@v4
        with:
          name: nightly-neural-benchmark
          path: benchmark-results/nightly-neural.json
