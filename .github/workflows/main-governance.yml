name: Main governance guard

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  verify-pr-origin:
    name: Verify main commit came through a pull request
    runs-on: ubuntu-latest
    steps:
      - name: Check commit provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          prs="$(gh api             "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls"             --jq '.[].number')"

          if [ -z "${prs}" ]; then
            echo "::error::This commit on main is not associated with a pull request."
            echo "Direct pushes to main should be prevented by the repository ruleset."
            exit 1
          fi

          echo "Commit ${GITHUB_SHA} is associated with pull request(s): ${prs}"
