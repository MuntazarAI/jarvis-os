name: JARVIS QA

# Dogfooding gate: our own CLI is the quality checker. Non-interactive,
# exit-code driven (Strix-style: red means red, scripts can trust it).

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  own-cli-qa:
    name: Own CLI as QA gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip pytest && python -m pip install -e .
      - name: Unit gate (board, durable, conductor, security)
        run: python -m pytest tests/test_board.py tests/test_durable_tasks.py tests/test_conductor.py tests/test_security_strix.py -q
      - name: Task doctor on a fresh home (must exit 0)
        run: python -m jarvis.cli --home /tmp/qa-home task doctor
      - name: Static self-review of own code (must exit 0)
        run: |
          python -m jarvis.cli --home /tmp/qa-home security review --target jarvis/security
          python -m jarvis.cli --home /tmp/qa-home security review --target jarvis/api
