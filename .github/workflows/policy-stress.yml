name: Policy Gate Stress Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "0 3 * * 1"  # weekly on Monday at 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy-stress:
    name: Policy gate stress test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install system test dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg xvfb xclip ydotool
      - name: Install project and test tooling
        run: python -m pip install --upgrade pip pytest && python -m pip install -e .
      - name: Run policy security tests
        run: python -m pytest tests/test_security.py tests/test_security_intel.py tests/test_sec_approvals.py tests/test_secaudit.py tests/test_security_strix.py -q --tb=short
      - name: Run policy gate boundary tests
        run: python -m pytest tests/test_policy.py tests/test_hardening.py -q --tb=short

  write-summary:
    name: Write policy stress summary
    runs-on: ubuntu-latest
    needs: [policy-stress]
    if: always()
    steps:
      - name: Write summary
        run: |
          {
            echo "## JARVIS-OS Policy Gate Stress Tests"
            echo ""
            echo "### Results"
            echo "- Policy security tests: ${{ needs.policy-stress.result }}"
          } >> "$GITHUB_STEP_SUMMARY"
