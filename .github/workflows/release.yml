name: Release JARVIS-OS

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example v4.1.0"
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Validate version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          python - <<'PY'
          import os, re
          version = os.environ["VERSION"].lstrip("v")
          if not re.fullmatch(r"\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?", version):
              raise SystemExit("Invalid semantic version")
          PY

      - name: Run release tests
        run: |
          python -m pip install --upgrade pip pytest
          python -m pip install -e .
          python -m pytest -q

      - name: Create source archives
        run: |
          mkdir -p dist
          git archive --format=tar.gz --prefix="jarvis-os-${{ inputs.version }}/" HEAD > "dist/jarvis-os-${{ inputs.version }}.tar.gz"
          git archive --format=zip --prefix="jarvis-os-${{ inputs.version }}/" HEAD > "dist/jarvis-os-${{ inputs.version }}.zip"

      - name: Generate checksums
        run: sha256sum dist/* > dist/SHA256SUMS

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: "dist/jarvis-os-${{ inputs.version }}.sbom.json"

      - name: Attest source archive
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/jarvis-os-${{ inputs.version }}.tar.gz"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ inputs.version }}" dist/*             --title "JARVIS-OS ${{ inputs.version }}"             --generate-notes
