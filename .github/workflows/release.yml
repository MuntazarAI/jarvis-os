name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example v4.0.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Create source release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Create release archive
        run: |
          mkdir -p dist
          git archive --format=tar.gz --prefix=jarvis-os-${{ inputs.version }}/ HEAD > dist/jarvis-os-${{ inputs.version }}.tar.gz
          git archive --format=zip --prefix=jarvis-os-${{ inputs.version }}/ HEAD > dist/jarvis-os-${{ inputs.version }}.zip
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ inputs.version }}" dist/* --title "JARVIS-OS ${{ inputs.version }}" --generate-notes
