name: Project health

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health:
    name: Tests and repository health
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install system test dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg xvfb xclip ydotool
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install project and test tooling
        run: python -m pip install --upgrade pip pytest && python -m pip install -e .
      - name: Run test suite
        run: xvfb-run -a bash -lc 'printf "ci-seed" | xclip -selection clipboard; python -m pytest -q'
      - name: Repository health checks
        shell: bash
        run: |
          set -euo pipefail
          test -f LICENSE
          test -f SECURITY.md
          test -f CONTRIBUTING.md
          test -f docs/site/index.html
          test -f docs/site/dashboard.html
          python -m compileall -q jarvis
      - name: Write health summary
        if: always()
        run: |
          {
            echo "## JARVIS-OS Project Health"
            echo ""
            echo "- Python: 3.13"
            echo "- Test and repository health checks: see job steps above"
            echo "- Documentation dashboard: docs/site/dashboard.html"
          } >> "$GITHUB_STEP_SUMMARY"
