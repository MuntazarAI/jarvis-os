name: Memory Consolidation Verification

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "0 1 * * 0"  # weekly on Sunday at 01:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  memory-consolidation:
    name: Memory consolidation verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install system test dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg xvfb xclip ydotool
      - name: Install project and test tooling
        run: python -m pip install --upgrade pip pytest && python -m pip install -e .
      - name: Run memory consolidation tests
        run: python -m pytest tests/test_memory3.py tests/test_memory2.py tests/test_consolidation.py tests/test_spatial_palace.py -q --tb=short
      - name: Run memory safety tests
        run: python -m pytest tests/test_forget.py tests/test_archive.py -q --tb=short

  write-summary:
    name: Write memory consolidation summary
    runs-on: ubuntu-latest
    needs: [memory-consolidation]
    if: always()
    steps:
      - name: Write summary
        run: |
          {
            echo "## JARVIS-OS Memory Consolidation Verification"
            echo ""
            echo "### Results"
            echo "- Memory consolidation: ${{ needs.memory-consolidation.result }}"
          } >> "$GITHUB_STEP_SUMMARY"
