name: Android transport

# 3.10: verify the Android node builds and its JVM unit tests pass.
# Emulator E2E stays out of CI (cost/flakiness); the wire protocol and
# host side are covered deterministically by tests/test_android_transport.py
# in the main CI suite, plus the Kotlin loopback tests below.

on:
  push:
    branches: ["main"]
    paths:
      - "android/**"
      - "jarvis/device/**"
      - "tests/test_android_transport.py"
      - "tests/test_android_node.py"
      - "tests/test_device_fabric.py"
      - ".github/workflows/android.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "android/**"
      - "jarvis/device/**"
      - "tests/test_android_transport.py"
      - "tests/test_android_node.py"
      - "tests/test_device_fabric.py"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kotlin:
    name: Kotlin unit tests and debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install platform and build-tools
        run: |
          set -euo pipefail
          sdkmanager --install "platforms;android-37" "build-tools;36.0.0" "platform-tools"
          yes | sdkmanager --licenses > /dev/null || true
      - name: Install Gradle 9.6.0
        run: |
          set -euo pipefail
          curl -sL https://services.gradle.org/distributions/gradle-9.6.0-bin.zip \
            -o /tmp/gradle-9.6.0.zip
          sudo unzip -q /tmp/gradle-9.6.0.zip -d /opt
          echo "/opt/gradle-9.6.0/bin" >> "$GITHUB_PATH"
      - name: Kotlin unit tests
        working-directory: android
        run: gradle :app:testDebugUnitTest
      - name: Debug APK
        working-directory: android
        run: gradle :app:assembleDebug
