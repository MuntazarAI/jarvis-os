# JARVIS OS Bridge — Cargo.toml

[package]
name = "jarvis-os-bridge"
version = "2.0.0"
edition = "2021"
description = "JARVIS-OS system bridge — Unix domain socket IPC between JARVIS intelligence and Linux"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# UUID
uuid = { version = "1", features = ["v4", "serde"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI
clap = { version = "4", features = ["derive"] }

# System information (read-only)
sysinfo = "0.30"

# Config parsing
toml = "0.8"

# Error handling
thiserror = "1"
anyhow = "1"

# Async trait support
async-trait = "0.1"

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# libc for statfs
libc = "0.2"

# tokio-util for framed reads
tokio-util = { version = "0.7", features = ["codec"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
panic = "abort"

[profile.dev]
panic = "abort"