[project]
name = "jarvis-os"
version = "0.1.0"
description = "JARVIS — Personal AI Operating System"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
llm = ["ollama"]
tts = ["piper-tts"]
stt = ["faster-whisper"]

[project.scripts]
jarvis = "jarvis.cli:main"

[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["jarvis*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
line-length = 100

[tool.isort]
profile = "black"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
