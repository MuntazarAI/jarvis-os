[project]
name = "jarvis-os"
version = "0.1.0"
description = "JARVIS — Personal AI Operating System"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.3.0",
    "torchvision>=0.18.0",
    "torchaudio>=2.3.0",
    "numpy>=1.26.0",
    "psutil>=5.9.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
    "rich>=13.7.0",
    "click>=8.1.0",
]

[project.optional-dependencies]
llm = ["ollama"]
tts = ["piper-tts"]
stt = ["faster-whisper"]
torch = [
    "torch>=2.3.0",
    "torchvision>=0.18.0",
    "torchaudio>=2.3.0",
]
torch-cuda = [
    "torch>=2.3.0",
    "torchvision>=0.18.0",
    "torchaudio>=2.3.0",
    "nvidia-cuda-runtime-cu12>=12.4.0",
]
training = [
    "torch>=2.3.0",
    "torchvision>=0.18.0",
    "tensorboard>=2.16.0",
    "wandb>=0.17.0",
    "accelerate>=0.30.0",
    "peft>=0.11.0",
]
distributed = [
    "torch>=2.3.0",
    "torchvision>=0.18.0",
    "torch-distributed>=0.1.0",
    "ray>=2.35.0",
]

[project.scripts]
jarvis = "jarvis.cli:main"
jarvis-bridge = "jarvis.os.bridge:main"
jarvis-train = "jarvis.neural.torch_integration:main"

[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["jarvis*"]

[tool.setuptools.package-data]
"jarvis.reports" = ["sql/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.black]
line-length = 100

[tool.isort]
profile = "black"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
]