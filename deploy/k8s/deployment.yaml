apiVersion: apps/v1
kind: Deployment
metadata:
  name: jarvis-os
  namespace: jarvis
  labels:
    app: jarvis-os
    version: v2.0.0
    component: core
spec:
  replicas: 3
  selector:
    matchLabels:
      app: jarvis-os
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: jarvis-os
        version: v2.0.0
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: jarvis-os
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: jarvis-os
          image: jarvis-os:v2.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          env:
            - name: JARVIS_CONFIG_PATH
              value: "/etc/jarvis/config.yaml"
            - name: JARVIS_DATA_DIR
              value: "/var/lib/jarvis"
            - name: JARVIS_LOG_DIR
              value: "/var/log/jarvis"
            - name: PYTHONUNBUFFERED
              value: "1"
          envFrom:
            - configMapRef:
                name: jarvis-config
                optional: true
            - secretRef:
                name: jarvis-secrets
                optional: true
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 40
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          volumeMounts:
            - name: config
              mountPath: /etc/jarvis
              readOnly: true
            - name: data
              mountPath: /var/lib/jarvis
            - name: logs
              mountPath: /var/log/jarvis
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: jarvis-config
            items:
              - key: config.yaml
                path: config.yaml
        - name: data
          persistentVolumeClaim:
            claimName: jarvis-data
        - name: logs
          persistentVolumeClaim:
            claimName: jarvis-logs
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - jarvis-os
                topologyKey: kubernetes.io/hostname