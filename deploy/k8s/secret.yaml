apiVersion: v1
kind: Secret
metadata:
  name: jarvis-secrets
  namespace: jarvis
  labels:
    app: jarvis-os
    component: core
  annotations:
    sealedsecrets.bitnami.com/managed: "true"
type: Opaque
stringData:
  # API Keys (replace with actual values or use SealedSecrets)
  OPENAI_API_KEY: ""
  ANTHROPIC_API_KEY: ""
  HUGGINGFACE_API_KEY: ""
  GITHUB_TOKEN: ""
  GITHUB_PAT: ""

  # Database
  DATABASE_URL: "postgresql://jarvis:changeme@postgres:5432/jarvis"

  # Redis
  REDIS_URL: "redis://redis:6379/0"

  # Encryption
  ENCRYPTION_KEY: "changeme-32-byte-encryption-key!!"
  JWT_SECRET: "changeme-jwt-secret-key-min-32-chars"

  # External Services
  SLACK_WEBHOOK_URL: ""
  DISCORD_WEBHOOK_URL: ""
  PAGERDUTY_KEY: ""

  # Monitoring
  GRAFANA_API_KEY: ""
  PROMETHEUS_REMOTE_WRITE_URL: ""
  PROMETHEUS_REMOTE_WRITE_USER: ""
  PROMETHEUS_REMOTE_WRITE_PASSWORD: ""