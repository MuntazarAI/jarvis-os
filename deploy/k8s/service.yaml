apiVersion: v1
kind: Service
metadata:
  name: jarvis-os
  namespace: jarvis
  labels:
    app: jarvis-os
    component: core
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
    - name: metrics
      port: 9090
      targetPort: 9090
      protocol: TCP
  selector:
    app: jarvis-os
---
apiVersion: v1
kind: Service
metadata:
  name: jarvis-os-headless
  namespace: jarvis
  labels:
    app: jarvis-os
    component: core
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
  selector:
    app: jarvis-os